# Machine Black Box - Mosquitto 2.x config for the WiFi demo
# Run from this folder:   mosquitto -c mosquitto.conf -v

# The ESP32 connects here over WiFi (plain MQTT)
listener 1883 0.0.0.0
protocol mqtt

# The dashboard in the browser connects here (MQTT over WebSocket)
listener 9001
protocol websockets

# Demo on a private hotspot only: no username/password
allow_anonymous true
